[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-agent"
version = "0.1.0"
description = "Creator content collection and evidence-based research agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
bilibili = ["bilibili-api-python==17.4.1", "httpx==0.28.1"]
transcription = [
    # faster-whisper 1.2.1 解码音频时使用 PyAV 的 metadata_errors 参数。
    "av==17.0.1",
    "faster-whisper==1.2.1",
    "opencc-python-reimplemented==0.1.7",
]
llm = ["httpx==0.28.1", "openai==2.38.0"]

[tool.setuptools.packages.find]
include = ["core", "core.*", "integration", "integration.*", "ingestion", "ingestion.*"]
exclude = ["core.test", "core.test.*", "integration.test", "integration.test.*", "ingestion.test", "ingestion.test.*"]

[tool.setuptools.package-data]
"core" = ["config.toml"]
"integration" = ["config.toml"]
