[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-valhalla"
dynamic = ["version"]
description = "Creator content collection and evidence-based research agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
bilibili = ["bilibili-api-python==17.4.1", "httpx==0.28.1"]
transcription = ["faster-whisper==1.2.1", "opencc-python-reimplemented==0.1.7"]
agent = [
    "faiss-cpu==1.14.2",
    "jieba==0.42.1",
    "numpy==2.4.6",
    "openai==2.38.0",
    "pydantic==2.13.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.5.1",
]
web = ["fastapi==0.137.0", "uvicorn==0.49.0"]

[tool.setuptools.dynamic]
version = {attr = "valhalla.__version__"}

[tool.setuptools.packages.find]
include = ["valhalla", "valhalla.*", "integration", "integration.*", "ingestion", "ingestion.*"]
exclude = ["valhalla.*.test", "valhalla.*.test.*", "integration.test", "integration.test.*", "ingestion.test", "ingestion.test.*"]

[tool.setuptools.package-data]
"integration" = ["config.toml"]
